<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الانضمام للجروب</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f9fe;color:#12263f;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:24px}
  p{font-size:18px;line-height:1.7;max-width:320px}
</style>
</head>
<body>
<p id="msg">جاري التحقق من الكود...</p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// نفس firebaseConfig بتاع display.html
const firebaseConfig = {
  apiKey: "AIzaSyCeR0xCg-mMewhMOMacxWGBB_Zfibl-rFk",
  authDomain: "lecture-qr.firebaseapp.com",
  databaseURL: "https://lecture-qr-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lecture-qr",
  appId: "1:862364138105:web:9bbff5eccc12827c0932a8"
};

const msg = document.getElementById("msg");
const t = new URLSearchParams(location.search).get("t");

(async () => {
  try {
    if (!t || !/^[0-9a-f]{32}$/.test(t)) throw new Error("bad");
    const db = getDatabase(initializeApp(firebaseConfig));
    const snap = await get(ref(db, "tokens/" + t));
    if (!snap.exists()) throw new Error("none");
    location.replace(snap.val().link);
  } catch (e) {
    msg.textContent = "الكود انتهت صلاحيته. امسح الكود الظاهر حالياً على الشاشة.";
  }
})();
</script>
</body>
</html>
